name: Build and validate

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install the tested compiler distribution
        run: python -m pip install ziglang==0.17.1
      - name: Compile the ARM64 module from the verified profile
        run: python build.py --zig python-zig --source-archive
      - name: Run host tests and check the distribution
        run: python tests/run_tests.py --zig python-zig --source-package dist/Hyrule-Cheat-Menu-v1.1.2-source.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Hyrule-Cheat-Menu-v1.1.2
          path: |
            dist/Hyrule-Cheat-Menu-v1.1.2.zip
            dist/Hyrule-Cheat-Menu-v1.1.2.zip.sha256
            dist/Hyrule-Cheat-Menu-v1.1.2-source.zip
            dist/Hyrule-Cheat-Menu-v1.1.2-source.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release v1.1.2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-v1.1.2
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: Hyrule-Cheat-Menu-v1.1.2
          path: dist
      - name: Verify the tested archive checksums
        working-directory: dist
        run: |
          sha256sum --check Hyrule-Cheat-Menu-v1.1.2.zip.sha256
          sha256sum --check Hyrule-Cheat-Menu-v1.1.2-source.zip.sha256
      - name: Refuse an existing release or tag
        run: |
          if gh release view v1.1.2 > /dev/null 2>&1; then
            echo "::error::Release v1.1.2 already exists; refusing to modify it."
            exit 1
          fi
          existing_tag="$(git ls-remote --tags origin refs/tags/v1.1.2)"
          if [ -n "$existing_tag" ]; then
            echo "::error::Tag v1.1.2 already exists; refusing to reuse or move it."
            exit 1
          fi
      - name: Publish the tested v1.1.2 release
        run: |
          gh release create v1.1.2 \
            --target "$GITHUB_SHA" \
            --title "Hyrule Cheat Menu v1.1.2" \
            --notes-file RELEASE_NOTES.md \
            --latest \
            dist/Hyrule-Cheat-Menu-v1.1.2.zip \
            dist/Hyrule-Cheat-Menu-v1.1.2.zip.sha256 \
            dist/Hyrule-Cheat-Menu-v1.1.2-source.zip \
            dist/Hyrule-Cheat-Menu-v1.1.2-source.zip.sha256 \
            RELEASE_NOTES.md
